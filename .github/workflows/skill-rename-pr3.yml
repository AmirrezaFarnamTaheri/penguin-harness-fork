name: Skill Naming Normalization (PR3)

on:
  push:
    branches: [feat/integrate-upstream-features]

permissions:
  contents: write

concurrency:
  group: skill-rename-pr3
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/integrate-upstream-features
      - uses: ./.github/actions/setup
      - name: Normalize ambiguous and bilingual skill names
        run: pnpm skills:names:normalize
      - name: Validate resulting corpus
        run: |
          pnpm skills:normalize:check
          pnpm skills:aliases:check
          pnpm skills:check
      - name: Commit deterministic skill renames
        shell: bash
        run: |
          if git diff --quiet -- .agents/skills packages/core/src/agent/skill-engine.ts; then
            echo "No naming changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .agents/skills packages/core/src/agent/skill-engine.ts
          git commit -m "refactor(skills): normalize routing-oriented skill names"
          git push origin HEAD:feat/integrate-upstream-features
