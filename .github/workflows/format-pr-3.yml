name: Format PR 3

on:
  push:
    branches:
      - feat/integrate-upstream-features

permissions:
  contents: write

concurrency:
  group: format-pr-3
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'AmirrezaFarnamTaheri/penguin-harness-fork'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v5
        with:
          ref: feat/integrate-upstream-features
          fetch-depth: 1

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Apply pinned Prettier formatting
        run: pnpm prettier --write .

      - name: Commit deterministic formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository formatting"
          git push origin HEAD:feat/integrate-upstream-features
