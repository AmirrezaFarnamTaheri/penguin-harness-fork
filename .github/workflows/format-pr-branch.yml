name: Format PR branch

on:
  push:
    branches:
      - feat/integrate-upstream-features

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: feat/integrate-upstream-features
          fetch-depth: 1

      - name: Set up repository toolchain
        uses: ./.github/actions/setup

      - name: Format repository
        run: pnpm format

      - name: Commit deterministic formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format integrated changes"
          git push origin HEAD:feat/integrate-upstream-features
