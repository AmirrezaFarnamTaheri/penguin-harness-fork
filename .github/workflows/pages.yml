# Public site: build the landing page (site root) and the docs site (/docs/) with Vite
# and deploy them as ONE artifact to GitHub Pages (scripts/build-site.mjs assembles the
# tree — landing dist with the docs dist copied under docs/).
# - Pull requests touching either package only BUILD (validation) — no Pages
#   configuration and no deploy, so PRs never fail on Pages availability.
# - Pushes to main (and manual dispatch) build + deploy. The site is served from the
#   custom apex domain https://penguin.ooo/ (Settings -> Pages -> Custom domain), so
#   BASE_PATH is "/" — assets resolve from the domain root, not a /<repo>/ subpath.
# - A FORK builds and validates exactly the same, but never deploys: Pages is configured on the
#   upstream repository (source = GitHub Actions, CNAME = penguin.ooo), and every other clone
#   inherits this workflow. Without the gate, a fork's push to main reaches deploy-pages,
#   which fails with a bare `HttpError: Not Found` — a 404 from createPagesDeployment because no
#   Pages site exists on that repository, not a broken build. That red run is a repo setting,
#   not code, so it cannot be fixed from the workflow and must not be "fixed" by claiming a
#   domain the fork does not own. Gate on `fork`, not on a repository name, so a second clone
#   behaves the same without an edit here.
# First-time setup (upstream repository only): Settings -> Pages -> Source = "GitHub Actions".
name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "packages/landing/**"
      - "packages/docs/**"
      - "scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "packages/landing/**"
      - "packages/docs/**"
      - "scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight production deploy finish rather than cancelling it.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      # pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site (landing + docs, vite)
        env:
          BASE_PATH: /
        run: pnpm build:site

      # Only the deploying runs need the Pages artifact (PRs stop at the build check,
      # and so does a fork — see the header note on why it must not deploy upstream's domain).
      - if: github.event_name != 'pull_request' && !github.event.repository.fork
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: packages/landing/dist

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.fork
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
